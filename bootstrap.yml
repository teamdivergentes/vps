---
# =============================================================================
# Bootstrap Playbook - FIRST RUN ONLY
# =============================================================================
# Connects as root on the current SSH port and prepares the server
# for subsequent runs via site.yml (deploy user, key-only auth).
#
# Usage:
#   ansible-playbook bootstrap.yml \
#     --ask-vault-pass \
#     -e "bootstrap_user=root" \
#     -e "bootstrap_port=22" \
#     --ask-pass
#
# IMPORTANT: Use bootstrap_user / bootstrap_port (NOT ansible_user / ansible_port)
# so that Phase 2 can reconnect as deploy without extra vars overriding it.
#
# After this playbook completes:
#   - root login is disabled
#   - Only key-based auth is allowed
#   - deploy user has sudo access
#   - Firewall is active
#   - You can run: ansible-playbook site.yml --ask-vault-pass
# =============================================================================

# ─────────────────────────────────────────────────────────────────────────────
# PHASE 1 — Run as root: prepare the server and restart SSH
# ─────────────────────────────────────────────────────────────────────────────
- name: "Bootstrap Phase 1: prepare server (as root)"
  hosts: vps
  become: true
  gather_facts: true
  vars:
    ansible_user: "{{ bootstrap_user | default('root') }}"
    ansible_port: "{{ bootstrap_port | default('22') }}"

  tasks:
    # -- 1. System update ------------------------------------------------------
    - name: Update apt cache and upgrade all packages
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist
        cache_valid_time: 3600

    - name: Install essential packages
      ansible.builtin.apt:
        name:
          - ufw
          - fail2ban
          - unattended-upgrades
          - curl
          - wget
          - git
          - python3-pip
          - ca-certificates
          - gnupg
          - sudo
        state: present

    # -- 2. Create deploy user -------------------------------------------------
    - name: Create deploy group
      ansible.builtin.group:
        name: "{{ deploy_group }}"
        state: present

    - name: Create deploy user
      ansible.builtin.user:
        name: "{{ deploy_user }}"
        group: "{{ deploy_group }}"
        groups: sudo
        shell: /bin/bash
        create_home: true
        state: present

    - name: Allow deploy user passwordless sudo
      ansible.builtin.copy:
        content: "{{ deploy_user }} ALL=(ALL) NOPASSWD:ALL\n"
        dest: "/etc/sudoers.d/{{ deploy_user }}"
        owner: root
        group: root
        mode: "0440"
        validate: "visudo -cf %s"

    # -- 3. SSH key ------------------------------------------------------------
    - name: Create .ssh directory for deploy user
      ansible.builtin.file:
        path: "/home/{{ deploy_user }}/.ssh"
        state: directory
        owner: "{{ deploy_user }}"
        group: "{{ deploy_group }}"
        mode: "0700"

    - name: Add authorized SSH keys for deploy user
      ansible.posix.authorized_key:
        user: "{{ deploy_user }}"
        key: "{{ item }}"
        state: present
      loop: "{{ ssh_authorized_keys }}"

    # -- 4. Firewall -----------------------------------------------------------
    - name: Configure UFW defaults
      community.general.ufw:
        direction: "{{ item.direction }}"
        policy: "{{ item.policy }}"
      loop:
        - { direction: incoming, policy: deny }
        - { direction: outgoing, policy: allow }

    - name: Allow SSH port through UFW
      community.general.ufw:
        rule: allow
        port: "{{ ssh_port }}"
        proto: tcp
        comment: "SSH"

    - name: Allow HTTP/HTTPS through UFW
      community.general.ufw:
        rule: allow
        port: "{{ item.port }}"
        proto: tcp
        comment: "{{ item.comment }}"
      loop:
        - { port: "80", comment: "HTTP" }
        - { port: "443", comment: "HTTPS" }

    - name: Allow TeamSpeak ports through UFW
      community.general.ufw:
        rule: allow
        port: "{{ item.port }}"
        proto: "{{ item.proto }}"
        comment: "{{ item.comment }}"
      loop:
        - { port: "9987", proto: udp, comment: "TeamSpeak Voice" }
        - { port: "30033", proto: tcp, comment: "TeamSpeak File Transfer" }
        - { port: "10011", proto: tcp, comment: "TeamSpeak ServerQuery" }

    - name: Enable UFW
      community.general.ufw:
        state: enabled
        logging: "on"

    # -- 5. Verify SSH key is installed BEFORE locking down --------------------
    - name: Read authorized_keys for deploy user
      ansible.builtin.slurp:
        src: "/home/{{ deploy_user }}/.ssh/authorized_keys"
      register: authkeys_content

    - name: Verify SSH key was properly installed
      ansible.builtin.assert:
        that:
          - ssh_authorized_keys | length > 0
          - (authkeys_content.content | b64decode) is search('ssh-')
        fail_msg: |
          CRITICAL: No SSH keys found in authorized_keys! Aborting to prevent lockout.
          Make sure vault_ssh_public_keys is set in your vault.

    # -- 6. Harden SSH configuration -------------------------------------------
    - name: Deploy hardened SSH configuration
      ansible.builtin.template:
        src: roles/common/templates/sshd_config.j2
        dest: /etc/ssh/sshd_config
        owner: root
        group: root
        mode: "0600"
        validate: "sshd -t -f %s"

    # -- 7. Configure fail2ban -------------------------------------------------
    - name: Deploy fail2ban configuration
      ansible.builtin.template:
        src: roles/common/templates/jail.local.j2
        dest: /etc/fail2ban/jail.local
        owner: root
        group: root
        mode: "0644"

    - name: Enable and start fail2ban
      ansible.builtin.systemd:
        name: fail2ban
        state: restarted
        enabled: true

    # -- 8. Restart SSH (async to avoid losing connection) ---------------------
    # After restart, root is locked out (AllowUsers deploy + PermitRootLogin no).
    # We use async + poll:0 so Ansible fires the restart without waiting for a
    # response that will never come back on the root connection.
    - name: Restart SSH with hardened config (async — root connection will drop)
      ansible.builtin.systemd:
        name: ssh
        state: restarted
      async: 30
      poll: 0

    # Small local pause to let sshd actually restart before Phase 2 connects
    - name: Wait for SSH to restart
      ansible.builtin.pause:
        seconds: 5

# ─────────────────────────────────────────────────────────────────────────────
# PHASE 2 — Reconnect as deploy user
# ─────────────────────────────────────────────────────────────────────────────
- name: "Bootstrap Phase 2: verify and finalize (as deploy)"
  hosts: vps
  become: true
  gather_facts: false
  vars:
    ansible_user: "{{ deploy_user }}"
    ansible_port: "{{ ssh_port }}"

  tasks:
    - name: Wait for SSH to be reachable as deploy user
      ansible.builtin.wait_for_connection:
        delay: 2
        timeout: 60

    - name: Verify SSH user is deploy (not root)
      ansible.builtin.command: whoami
      become: false
      register: whoami_result
      changed_when: false

    - name: Assert connection is as deploy user
      ansible.builtin.assert:
        that:
          - deploy_user in whoami_result.stdout
        fail_msg: "ERROR: Connected as {{ whoami_result.stdout }}, expected {{ deploy_user }}"

    # -- Final message ---------------------------------------------------------
    - name: Bootstrap complete
      ansible.builtin.debug:
        msg: |
          ============================================================
          BOOTSTRAP COMPLETE!
          ============================================================
          Root login is DISABLED.
          Password auth is DISABLED.
          SSH key-only auth for user '{{ deploy_user }}'.

          Test your access:
            ssh {{ deploy_user }}@{{ ansible_host }}

          Then run the full deployment:
            ansible-playbook site.yml --ask-vault-pass
          ============================================================

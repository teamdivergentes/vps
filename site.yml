---
# =============================================================================
# Main Playbook - TeamDivergentes VPS Infrastructure
# =============================================================================
# Usage:
#   Full deploy:  ansible-playbook site.yml --ask-vault-pass
#   Tags:         ansible-playbook site.yml --ask-vault-pass --tags "website"
#   Limit:        ansible-playbook site.yml --ask-vault-pass --limit vps-prod
# =============================================================================

- name: Configure VPS infrastructure
  hosts: vps
  become: true

  roles:
    # 1. System hardening, SSH keys, firewall
    - role: common
      tags: [common, security]

    # 2. Docker + Docker Compose
    - role: docker
      tags: [docker]

    # 3. Traefik reverse proxy
    - role: traefik
      tags: [traefik, proxy]

    # 4. Shared PostgreSQL (website + discord bot)
    - role: postgresql
      tags: [postgresql, database]

    # 5. Website (preprod + prod)
    - role: website
      tags: [website, app]

    # 6. Odoo ERP (with dedicated PG 16)
    - role: odoo
      tags: [odoo, app]

    # 7. TeamSpeak 3 server
    - role: teamspeak
      tags: [teamspeak, ts3]

    # 8. Discord bot
    - role: discord-bot
      tags: [discord, bot]

    # 9. Portainer (Docker UI)
    - role: portainer
      tags: [portainer, monitoring]

    # 10. pgAdmin (PostgreSQL web UI)
    - role: pgadmin
      tags: [pgadmin, monitoring]

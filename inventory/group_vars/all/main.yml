---
# =============================================================================
# Global Configuration - TeamDivergentes VPS
# =============================================================================

# -- Domain ------------------------------------------------------------------
domain: temp.teamdivergentes.fr
acme_email: "si@teamdivergentes.fr"
# Uncomment to use Let's Encrypt staging (avoids rate limits during testing)
# acme_ca_server: "https://acme-staging-v02.api.letsencrypt.org/directory"

# -- SSH ---------------------------------------------------------------------
ssh_port: 22
ssh_authorized_keys: "{{ vault_ssh_public_keys }}"

# -- Deploy user -------------------------------------------------------------
deploy_user: deploy
deploy_group: deploy

# -- Docker network -----------------------------------------------------------
docker_network: traefik-public

# -- Docker registries --------------------------------------------------------
ghcr_registry: ghcr.io
ghcr_user: "{{ vault_ghcr_user }}"
ghcr_token: "{{ vault_ghcr_token }}"
dockerhub_user: "{{ vault_dockerhub_user }}"
dockerhub_token: "{{ vault_dockerhub_token }}"

# -- Docker images (built by CI, pulled from GHCR) ----------------------------
website_backend_image: "{{ ghcr_registry }}/teamdivergentes/website_backend/dvg_web_backend"
website_frontend_image: "{{ ghcr_registry }}/teamdivergentes/website_frontend/dvg_web_frontend"
discord_bot_image: "{{ ghcr_registry }}/teamdivergentes/discord-js-dvg"

# -- Image tags per environment ------------------------------------------------
website_preprod_tag: "unstable-develop" # "PREPROD" lorsque merge sur main
website_prod_tag: "RELEASE" # "RELEASE" lorsque tag nouvelle version.
discord_bot_tag: "unstable-feat-upgrade" # "RELEASE" lorsque tag nouvelle version.

# -- Shared PostgreSQL (website + discord bot) ---------------------------------
shared_pg_user: "{{ vault_shared_pg_user | default('dvg_admin') }}"
shared_pg_password: "{{ vault_shared_pg_password }}"
shared_pg_port: 5432

# -- Preprod website -----------------------------------------------------------
preprod_domain: "preprod.{{ domain }}"
preprod_db_name: "{{ vault_preprod_db_name | default('dvg_preprod') }}"
preprod_db_user: "{{ vault_preprod_db_user | default('dvg_preprod') }}"
preprod_db_password: "{{ vault_preprod_db_password }}"
preprod_jwt_secret: "{{ vault_preprod_jwt_secret }}"
preprod_robots_allow: "false"  # Preprod: no indexing

# -- Prod website --------------------------------------------------------------
prod_domain: "{{ domain }}"
prod_www_domain: "www.{{ domain }}"
prod_db_name: "{{ vault_prod_db_name | default('dvg_prod') }}"
prod_db_user: "{{ vault_prod_db_user | default('dvg_prod') }}"
prod_db_password: "{{ vault_prod_db_password }}"
prod_jwt_secret: "{{ vault_prod_jwt_secret }}"
prod_robots_allow: "true"  # Prod: allow indexing

# -- Google Analytics ----------------------------------------------------------
preprod_google_analytics_id: "G-1WVR4Z1VG1"
prod_google_analytics_id: "G-73G860CZKB"
# GA4 Data API (service account shared between preprod/prod)
ga_property_id: "{{ vault_ga_property_id }}"
ga_client_email: "{{ vault_ga_client_email }}"
ga_private_key: "{{ vault_ga_private_key }}"
# Stream IDs per environment (to filter API data by stream)
preprod_ga_stream_id: "13358646293"
prod_ga_stream_id: "11249459235"

# -- Odoo (PostgreSQL dédié) ---------------------------------------------------
odoo_domain: "odoo.{{ domain }}"
odoo_image: "tellebma/isii_app:odoo-19-latest"
odoo_db_user: "{{ vault_odoo_db_user | default('odoo19') }}"
odoo_db_name: "{{ vault_odoo_db_name | default('odoo19') }}"
odoo_db_password: "{{ vault_odoo_db_password }}"
odoo_admin_password: "{{ vault_odoo_admin_password }}"

# -- TeamSpeak -----------------------------------------------------------------
ts3_domain: "ts3.{{ domain }}"

# -- Discord bot ---------------------------------------------------------------
discord_bot_token: "{{ vault_discord_bot_token }}"
discord_client_id: "{{ vault_discord_client_id }}"
discord_db_name: "{{ vault_discord_db_name | default('discord_bot') }}"
discord_db_user: "{{ vault_discord_db_user | default('discord_bot') }}"
discord_db_password: "{{ vault_discord_db_password }}"
discord_gemini_api_key: "{{ vault_discord_gemini_api_key }}"
discord_google_credentials: "{{ vault_discord_google_credentials }}"

# -- Portainer -----------------------------------------------------------------
portainer_domain: "portainer.{{ domain }}"

# -- pgAdmin -------------------------------------------------------------------
pgadmin_domain: "pgadmin.{{ domain }}"
pgadmin_email: "admin@{{ domain }}"
pgadmin_password: "{{ vault_pgadmin_password }}"

# -- Base paths ----------------------------------------------------------------
apps_root: /opt/apps

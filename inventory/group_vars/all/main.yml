---
# =============================================================================
# Global Configuration - TeamDivergentes VPS
# =============================================================================

# -- Ansible managed banner ---------------------------------------------------
# Depuis ansible-core 2.19, la variable `ansible_managed` n'est plus injectee
# automatiquement dans les templates inline (ex : `content: |` dans un module).
# Definir ici via group_vars la rend disponible partout (templates de fichiers,
# content de copy, etc.). La methode `ansible_managed = ...` dans ansible.cfg
# fonctionne encore mais sera retiree en ansible-core 2.23.
ansible_managed: "Ansible managed: do not edit by hand"


# -- Domain ------------------------------------------------------------------
domain: teamdivergentes.fr
acme_email: "si@teamdivergentes.fr"
# Uncomment to use Let's Encrypt staging (avoids rate limits during testing)
# acme_ca_server: "https://acme-staging-v02.api.letsencrypt.org/directory"

# -- SSH ---------------------------------------------------------------------
ssh_port: 22
ssh_authorized_keys: "{{ vault_ssh_public_keys }}"

# -- Deploy user -------------------------------------------------------------
deploy_user: deploy
deploy_group: deploy

# -- Docker network -----------------------------------------------------------
docker_network: traefik-public

# -- Docker registries --------------------------------------------------------
ghcr_registry: ghcr.io
ghcr_user: "{{ vault_ghcr_user }}"
ghcr_token: "{{ vault_ghcr_token }}"
dockerhub_user: "{{ vault_dockerhub_user }}"
dockerhub_token: "{{ vault_dockerhub_token }}"

# -- Docker images (built by CI, pulled from GHCR) ----------------------------
website_backend_image: "{{ ghcr_registry }}/teamdivergentes/website_backend/dvg_web_backend"
website_frontend_image: "{{ ghcr_registry }}/teamdivergentes/website_frontend/dvg_web_frontend"
discord_bot_image: "{{ ghcr_registry }}/teamdivergentes/discord-js-dvg"

# -- Image tags per environment ------------------------------------------------
website_preprod_tag: "PREPROD"
website_prod_tag: "RELEASE" # "RELEASE" lorsque tag nouvelle version.
discord_bot_tag: "RELEASE" # tag mobile pousse par le pipeline sur tag v*.*.*; epingler "X.Y.Z-RELEASE" pour figer une version.

# -- Shared PostgreSQL (website + discord bot) ---------------------------------
shared_pg_user: "{{ vault_shared_pg_user | default('dvg_admin') }}"
shared_pg_password: "{{ vault_shared_pg_password }}"
shared_pg_port: 5432

# -- Preprod website -----------------------------------------------------------
preprod_domain: "preprod.{{ domain }}"
preprod_db_name: "{{ vault_preprod_db_name | default('dvg_preprod') }}"
preprod_db_user: "{{ vault_preprod_db_user | default('dvg_preprod') }}"
preprod_db_password: "{{ vault_preprod_db_password }}"
preprod_jwt_secret: "{{ vault_preprod_jwt_secret }}"
preprod_robots_allow: "false"  # Preprod: no indexing

# -- Prod website --------------------------------------------------------------
prod_domain: "{{ domain }}"
prod_www_domain: "www.{{ domain }}"
prod_db_name: "{{ vault_prod_db_name | default('dvg_prod') }}"
prod_db_user: "{{ vault_prod_db_user | default('dvg_prod') }}"
prod_db_password: "{{ vault_prod_db_password }}"
prod_jwt_secret: "{{ vault_prod_jwt_secret }}"
prod_robots_allow: "true"  # Prod: allow indexing

# -- SEO meta tags -------------------------------------------------------------
# SITE_URL est injectee dans le conteneur frontend via docker-compose-website.yml.j2.
# Elle est construite dynamiquement : SITE_URL=https://{{ site_domain }}
# - Preprod : https://preprod.teamdivergentes.fr  (= preprod_domain)
# - Prod    : https://teamdivergentes.fr          (= prod_domain)
# Le frontend (SeoService / RuntimeConfigService) consomme cette valeur pour
# resoudre les URLs canoniques, og:image, twitter:image et JSON-LD.
# Ne pas hardcoder d'URL de domaine dans le code applicatif :
# toujours lire RuntimeConfigService.siteUrl (issu de /assets/config.json).

# -- Google Analytics ----------------------------------------------------------
preprod_google_analytics_id: "G-1WVR4Z1VG1"
prod_google_analytics_id: "G-73G860CZKB"
# Matomo Analytics (auto-hebergé sur matomo.tellebma.fr — EPIC-18 test parallèle)
# Site IDs créés via API le 2026-05-11
matomo_url: "https://matomo.tellebma.fr/"
preprod_matomo_site_id: 5
prod_matomo_site_id: 6
# GA4 Data API (service account shared between preprod/prod)
ga_property_id: "{{ vault_ga_property_id }}"
ga_client_email: "{{ vault_ga_client_email }}"
ga_private_key: "{{ vault_ga_private_key }}"
# Stream IDs per environment (to filter API data by stream)
preprod_ga_stream_id: "13358646293"
prod_ga_stream_id: "11249459235"

# -- Odoo (PostgreSQL dédié) ---------------------------------------------------
odoo_domain: "odoo.{{ domain }}"
odoo_image: "tellebma/isii_app:odoo-19-latest"
odoo_db_user: "{{ vault_odoo_db_user | default('odoo19') }}"
odoo_db_name: "{{ vault_odoo_db_name | default('odoo19') }}"
odoo_db_password: "{{ vault_odoo_db_password }}"
odoo_admin_password: "{{ vault_odoo_admin_password }}"
# Cron de renouvellement de licence Odoo Enterprise.
# Cible les cles ir_config_parameter : database.expiration_date,
# database.expiration_reason et database.enterprise_code.
# Tourne tous les mois (1er du mois a 03:00 heure locale) pour pousser
# la date d'expiration a aujourd'hui + 3 ans et redemarrer odoo-web/nginx.
odoo_license_renew_minute: "0"
odoo_license_renew_hour: "3"
odoo_license_renew_day: "1"

# -- TeamSpeak -----------------------------------------------------------------
ts3_domain: "ts3.{{ domain }}"

# -- Discord bot ---------------------------------------------------------------
discord_bot_token: "{{ vault_discord_bot_token }}"
discord_client_id: "{{ vault_discord_client_id }}"
discord_db_name: "{{ vault_discord_db_name | default('discord_bot') }}"
discord_db_user: "{{ vault_discord_db_user | default('discord_bot') }}"
discord_db_password: "{{ vault_discord_db_password }}"
discord_gemini_api_key: "{{ vault_discord_gemini_api_key }}"
discord_google_credentials: "{{ vault_discord_google_credentials }}"

# -- Portainer -----------------------------------------------------------------
portainer_domain: "portainer.{{ domain }}"

# -- pgAdmin -------------------------------------------------------------------
pgadmin_domain: "pgadmin.{{ domain }}"
pgadmin_email: "admin@{{ domain }}"
pgadmin_password: "{{ vault_pgadmin_password }}"

# -- Monitoring (Prometheus + Grafana) -----------------------------------------
grafana_domain: "grafana.{{ domain }}"
grafana_admin_user: "admin"
grafana_admin_password: "{{ vault_grafana_admin_password }}"
grafana_basicauth_users: "{{ vault_grafana_basicauth_users }}"
monitoring_retention_time: "30d"
monitoring_retention_size: "1GB"
monitoring_scrape_interval: "30s"
discord_monitoring_webhook: "{{ vault_discord_monitoring_webhook }}"
pg_exporter_dsn: "{{ vault_pg_exporter_dsn }}"

# -- GitHub Actions self-hosted runner -----------------------------------------
github_runner_image: "myoung34/github-runner"
# Pin this, don't use latest — update after audit
# ATTENTION : GitHub deprecie les anciennes versions de runner et refuse de leur
# envoyer des jobs ("Runner version vX is deprecated and cannot receive messages"),
# ce qui bloque toute la CI en "queued" sans erreur explicite.
# A verifier regulierement : https://github.com/actions/runner/releases
github_runner_tag: "2.336.0-ubuntu-noble"
# Bridge network used when github_runner_network_mode is "bridge".
# Ignored when github_runner_network_mode is "host".
github_runner_network: "github-runner-net"
# "host" : le runner partage la stack reseau de l'hote. Requis pour que les
#   jobs qui font `docker compose up` puis `curl localhost:PORT` fonctionnent
#   (ex: e2e-fullstack). Sans ce mode, `localhost` dans le runner designe le
#   container runner lui-meme, pas l'hote, donc les curls echouent.
# "bridge" : isolation reseau stricte (moins pratique pour les tests e2e).
github_runner_network_mode: "host"
# scope: "org" (runs jobs for any repo in the org) or "repo" (single repo)
github_runner_scope: "org"
github_runner_org: "teamdivergentes"
github_runner_repo: "vps"  # only used when github_runner_scope == "repo"
github_runner_name_prefix: "vps-runner"
github_runner_labels: "self-hosted,linux,vps,docker"
# ephemeral: false economise ~30s de re-registration par job (pas de dés-enregistrement
# entre les jobs). Acceptable car tous nos repos sont prives et de confiance.
# Passer a true si un repo public ou un fork externe peut soumettre des jobs :
# chaque job obtiendrait alors un runner vierge (etat isole garanti).
github_runner_ephemeral: false
# replicas : nombre de containers runner lances en parallele.
# Chaque runner consomme github_runner_mem_limit RAM + github_runner_cpus vCPU.
# Dimensionnement VPS recommande :
#   replicas: 2 → minimum 4 vCPU + 10 Go RAM disponibles
#   replicas: 3 → minimum 6 vCPU + 14 Go RAM disponibles
#   replicas: 4 → minimum 8 vCPU + 20 Go RAM disponibles
# Maximum documente : 4 (au-dela les builds Docker paralleles saturent le disque).
github_runner_replicas: 2
# Ressources PAR runner : un build Docker multi-stage NestJS/Angular avec Buildx
# consomme facilement 2-3 GB de RAM. 1g etait insuffisant et provoquait OOM /
# retries en boucle (symptome : job docker qui tourne 30+ min sans progresser).
github_runner_mem_limit: "4g"
github_runner_cpus: 2.0
github_runner_access_token: "{{ vault_github_runner_token }}"
# Fenetre de nettoyage Docker (prune des images/volumes/build cache orphelins).
# Execute via un cron systeme chaque nuit a 03:30 heure locale, hors des
# horaires ou les CI de l'equipe tournent habituellement.
github_runner_prune_hour: "3"
github_runner_prune_minute: "30"

# -- Twitch API ----------------------------------------------------------------
twitch_client_id: "{{ vault_twitch_client_id }}"
twitch_client_secret: "{{ vault_twitch_client_secret }}"

# -- Base paths ----------------------------------------------------------------
apps_root: /opt/apps

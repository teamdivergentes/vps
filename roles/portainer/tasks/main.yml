---
# =============================================================================
# Portainer role - Docker management UI
# =============================================================================

- name: Create Portainer directory
  ansible.builtin.file:
    path: "{{ apps_root }}/portainer"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "0750"

- name: Deploy Portainer docker-compose
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ apps_root }}/portainer/docker-compose.yml"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "0640"
  notify: Restart portainer

- name: Start Portainer
  community.docker.docker_compose_v2:
    project_src: "{{ apps_root }}/portainer"
    state: present
  become: true
  become_user: "{{ deploy_user }}"

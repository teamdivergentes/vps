---
# Collecte de diagnostic du frontend, a la demande.
#
# La verification post-deploiement (verify-ssr.yml) ne regarde qu'un instant
# precis : la fin du deploiement. Or le rendu serveur de la preprod a ete vu
# fonctionnel juste apres une recreation de conteneur, puis servant un shell
# client quelques minutes plus tard. Un defaut qui apparait apres coup echappe
# donc entierement a la sonde de deploiement.
#
# Ce fichier existe pour aller chercher l'etat du conteneur a n'importe quel
# moment, sans se connecter au VPS a la main :
#
#   gh workflow run deploy.yml --repo teamdivergentes/vps --ref main \
#     -f tags=website-diag -f deploy_environment=PREPROD
#
# Il ne modifie rien : que des lectures.

- name: "Etat du conteneur frontend {{ website_env }}"
  ansible.builtin.command:
    argv:
      - docker
      - inspect
      # Le compteur de redemarrages est le signal utile : la sonde de sante,
      # elle, reste au vert pendant que le conteneur sert un shell client.
      - "--format={{ '{{' }}.State.Status{{ '}}' }} demarre={{ '{{' }}.State.StartedAt{{ '}}' }} redemarrages={{ '{{' }}.RestartCount{{ '}}' }}"
      - "website-{{ website_env }}-frontend"
  become: true
  become_user: "{{ deploy_user }}"
  register: website_diag_state
  changed_when: false

- name: "Consommation du conteneur frontend {{ website_env }}"
  ansible.builtin.command:
    argv:
      - docker
      - stats
      - --no-stream
      - "--format={{ '{{' }}.MemUsage{{ '}}' }} | CPU {{ '{{' }}.CPUPerc{{ '}}' }}"
      - "website-{{ website_env }}-frontend"
  become: true
  become_user: "{{ deploy_user }}"
  register: website_diag_stats
  changed_when: false

# Deux requetes, et la comparaison est tout l'interet de la tache : la premiere
# emprunte le chemin d'un visiteur (domaine public), la seconde la boucle
# locale. Un ecart entre les deux localise la panne entre Traefik et le moteur
# de rendu, plutot que dans le rendu lui-meme.
- name: "Rendu vu par un visiteur — frontend {{ website_env }}"
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "website-{{ website_env }}-frontend"
      - wget
      - -qO-
      - "--header=Host: {{ website_domain }}"
      - "--header=X-Forwarded-Proto: https"
      - http://127.0.0.1:80/
  become: true
  become_user: "{{ deploy_user }}"
  register: website_diag_public
  changed_when: false
  failed_when: false

# Troisieme sonde : le jeu d'en-tetes complet que Traefik ajoute.
#
# Les deux sondes precedentes rendent correctement pendant que les requetes
# arrivees par Traefik servent un shell client. Le conteneur, l'image et
# l'environnement etant identiques dans les deux cas, l'ecart ne peut venir que
# de la requete elle-meme. Cette sonde isole la variable.
- name: "Rendu avec les en-tetes Traefik — frontend {{ website_env }}"
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "website-{{ website_env }}-frontend"
      - wget
      - -qO-
      - "--header=Host: {{ website_domain }}"
      - "--header=X-Forwarded-Proto: https"
      - "--header=X-Forwarded-Host: {{ website_domain }}"
      - "--header=X-Forwarded-Port: 443"
      - "--header=X-Forwarded-For: 203.0.113.7"
      - "--header=X-Real-Ip: 203.0.113.7"
      - "--header=X-Forwarded-Server: traefik"
      - "--header=Accept-Encoding: gzip"
      - http://127.0.0.1:80/
  become: true
  become_user: "{{ deploy_user }}"
  register: website_diag_traefik
  changed_when: false
  failed_when: false

- name: "Rendu vu en boucle locale — frontend {{ website_env }}"
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "website-{{ website_env }}-frontend"
      - wget
      - -qO-
      - http://127.0.0.1:80/
  become: true
  become_user: "{{ deploy_user }}"
  register: website_diag_loopback
  changed_when: false
  failed_when: false

# L'image et l'environnement effectifs du conteneur en cours d'execution. La
# meme image, lancee en local avec les memes variables, rend correctement : si
# l'ecart n'est ni dans l'image ni dans l'environnement, il faut le chercher
# ailleurs — et si l'un des deux differe, la piste s'arrete la.
- name: "Image et environnement du conteneur frontend {{ website_env }}"
  ansible.builtin.command:
    argv:
      - docker
      - inspect
      - "--format={{ '{{' }}.Image{{ '}}' }}%%{{ '{{' }}json .Config.Env{{ '}}' }}"
      - "website-{{ website_env }}-frontend"
  become: true
  become_user: "{{ deploy_user }}"
  register: website_diag_image
  changed_when: false

# Discriminant decisif sur l'origine du HTML servi.
#
# `entrypoint.sh` substitue les placeholders dans le `index.csr.html` pose sur
# le disque. Si ce fichier n'en contient plus et que la reponse en contient
# encore, alors le HTML ne vient pas du disque : il vient de la copie du shell
# client embarquee dans le bundle serveur, que rien ne substitue. Cela situe la
# panne dans le moteur de rendu, et non dans Nginx ni dans l'entrypoint.
- name: "Placeholders restants sur le disque — frontend {{ website_env }}"
  ansible.builtin.shell:
    cmd: >-
      docker exec website-{{ website_env }}-frontend
      grep -c '__OG_TITLE__' /usr/share/nginx/html/index.csr.html || true
  become: true
  become_user: "{{ deploy_user }}"
  register: website_diag_disk
  changed_when: false

# Qui d'autre repond a ce nom de domaine ?
#
# Le conteneur nomme rend correctement a toutes les sondes internes, quelles
# que soient les en-tetes, pendant que les requetes arrivees par Traefik
# servent un shell client. Si le conteneur interroge n'est pas celui que
# Traefik atteint, un second conteneur porte les memes etiquettes — un orphelin
# laisse par une recreation, que `docker compose` ne suit plus.
# Coupe la chaine en deux.
#
# Les sondes precedentes partent de l'interieur du conteneur, donc par sa
# boucle locale. Celle-ci part de l'hote et vise l'adresse du conteneur sur le
# reseau Docker : c'est le chemin qu'emprunte Traefik, moins Traefik lui-meme.
#
# Un rendu correct ici innocente Nginx et le moteur de rendu, et met en cause
# ce que Traefik fait de la requete ou de la reponse. Un shell client, au
# contraire, montre que la reponse depend de l'interface d'arrivee.
- name: "Adresse du conteneur frontend {{ website_env }}"
  ansible.builtin.command:
    argv:
      - docker
      - inspect
      - "--format={{ '{{' }}range .NetworkSettings.Networks{{ '}}' }}{{ '{{' }}.IPAddress{{ '}}' }}{{ '{{' }}end{{ '}}' }}"
      - "website-{{ website_env }}-frontend"
  become: true
  become_user: "{{ deploy_user }}"
  register: website_diag_ip
  changed_when: false

- name: "Rendu depuis l'hote, sans Traefik — frontend {{ website_env }}"
  ansible.builtin.uri:
    url: "http://{{ website_diag_ip.stdout | trim }}/"
    headers:
      Host: "{{ website_domain }}"
      X-Forwarded-Proto: https
    return_content: true
    status_code: [200, 400, 404, 500, 502, 504]
  register: website_diag_host
  changed_when: false
  failed_when: false

- name: "Conteneurs declarant le routeur website-{{ website_env }}"
  ansible.builtin.command:
    argv:
      - docker
      - ps
      - -a
      - "--filter=label=traefik.http.routers.website-{{ website_env }}.rule"
      - "--format={{ '{{' }}.Names{{ '}}' }} | {{ '{{' }}.Image{{ '}}' }} | {{ '{{' }}.Status{{ '}}' }}"
  become: true
  become_user: "{{ deploy_user }}"
  register: website_diag_siblings
  changed_when: false
  failed_when: false

# Ou Traefik envoie-t-il reellement les requetes ?
#
# Le conteneur rend correctement quand on l'interroge depuis l'hote, a son
# adresse sur le reseau Docker — le chemin exact de Traefik, moins Traefik.
# Comme un reverse proxy ne reecrit pas un corps de reponse, c'est qu'il ne
# parle pas a ce conteneur.
#
# Le journal d'acces de Traefik, au format CLF, termine chaque ligne par le nom
# du routeur retenu et l'URL du service vers lequel la requete a ete relayee.
# C'est la reponse directe a la question.
- name: "Journal d'acces Traefik pour {{ website_domain }}"
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      docker exec traefik tail -n 400 /var/log/traefik/access.log
      | grep -F '{{ website_domain }}'
      | tail -n 15
    executable: /bin/bash
  become: true
  become_user: "{{ deploy_user }}"
  register: website_diag_traefik_log
  changed_when: false
  failed_when: false

# Le fournisseur « file » de Traefik surveille tout un repertoire. Un fichier
# qui s'y trouverait sans etre pose par le role pourrait declarer un routeur
# concurrent, avec une priorite superieure a celui issu des etiquettes Docker.
- name: "Fichiers de configuration dynamique de Traefik"
  ansible.builtin.command:
    argv: [docker, exec, traefik, ls, -la, /etc/traefik/config]
  become: true
  become_user: "{{ deploy_user }}"
  register: website_diag_traefik_files
  changed_when: false
  failed_when: false

- name: "Logs du conteneur frontend {{ website_env }}"
  ansible.builtin.command:
    argv:
      - docker
      - logs
      - --tail
      - "150"
      - "website-{{ website_env }}-frontend"
  become: true
  become_user: "{{ deploy_user }}"
  register: website_diag_logs
  changed_when: false

- name: "Diagnostic du frontend {{ website_env }}"
  ansible.builtin.debug:
    msg:
      - "Etat        : {{ website_diag_state.stdout }}"
      - "Ressources  : {{ website_diag_stats.stdout }}"
      - "Image       : {{ website_diag_image.stdout.split('%%') | first }}"
      - "Environnement : {{ website_diag_image.stdout.split('%%') | last }}"
      - >-
        Placeholders sur le disque : {{ website_diag_disk.stdout | trim }}
        (0 = entrypoint a bien substitue, donc un HTML servi avec placeholders
        vient du bundle serveur)
      - >-
        Rendu visiteur  : {{ 'SHELL CLIENT'
        if '__OG_TITLE__' in website_diag_public.stdout
        else 'rendu serveur' }} ({{ website_diag_public.stdout | length }} octets)
      - >-
        Rendu loopback  : {{ 'SHELL CLIENT'
        if '__OG_TITLE__' in website_diag_loopback.stdout
        else 'rendu serveur' }} ({{ website_diag_loopback.stdout | length }} octets)
      - >-
        Rendu en-tetes Traefik : {{ 'SHELL CLIENT'
        if '__OG_TITLE__' in website_diag_traefik.stdout
        else 'rendu serveur' }} ({{ website_diag_traefik.stdout | length }} octets)
      - >-
        Rendu depuis l'hote (sans Traefik) : {{ 'SHELL CLIENT'
        if '__OG_TITLE__' in (website_diag_host.content | default(''))
        else 'rendu serveur' }} ({{ (website_diag_host.content | default('')) | length }} octets,
        HTTP {{ website_diag_host.status | default('?') }})
      - "--- journal d'acces Traefik (routeur et service en fin de ligne) ---"
      - "{{ website_diag_traefik_log.stdout_lines | default([]) }}"
      - "--- configuration dynamique de Traefik ---"
      - "{{ website_diag_traefik_files.stdout_lines | default([]) }}"
      - "--- conteneurs portant le meme routeur Traefik ---"
      - "{{ website_diag_siblings.stdout_lines }}"
      - "--- logs ---"
      - "{{ website_diag_logs.stdout_lines }}"

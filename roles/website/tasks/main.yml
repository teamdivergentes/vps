---
# =============================================================================
# Website role - Pull pre-built images from GHCR, deploy preprod + prod
# Both environments use the shared PostgreSQL instance
# Images are built by CI pipelines and pushed to GitHub Container Registry
#
# Variable optionnelle (rollback) :
#   image_tag_override : reference complete d'image (ghcr.io/org/repo/image:tag
#                        ou ghcr.io/org/repo/image@sha256:...) qui surcharge
#                        a la fois le backend ET le frontend pour le rollback.
#                        Generalement seul l'un des deux est fourni par le CI
#                        emetteur du rollback.
# =============================================================================

# -- Calcul des references d'image pour preprod --------------------------------
# Si image_tag_override est fourni et correspond a l'image backend, l'utiliser ;
# sinon construire la reference standard.
# La correspondance se fait sur le prefixe de l'image.

- name: Resoudre les images preprod
  vars:
    _override: "{{ image_tag_override | default('') }}"
  ansible.builtin.set_fact:
    effective_preprod_backend_image: >-
      {{
        _override
        if (_override | length > 0
            and (_override.startswith(website_backend_image + ':')
                 or _override.startswith(website_backend_image + '@')))
        else website_backend_image + ':' + website_preprod_tag
      }}
    effective_preprod_frontend_image: >-
      {{
        _override
        if (_override | length > 0
            and (_override.startswith(website_frontend_image + ':')
                 or _override.startswith(website_frontend_image + '@')))
        else website_frontend_image + ':' + website_preprod_tag
      }}

- name: Resoudre les images prod
  vars:
    _override: "{{ image_tag_override | default('') }}"
  ansible.builtin.set_fact:
    effective_prod_backend_image: >-
      {{
        _override
        if (_override | length > 0
            and (_override.startswith(website_backend_image + ':')
                 or _override.startswith(website_backend_image + '@')))
        else website_backend_image + ':' + website_prod_tag
      }}
    effective_prod_frontend_image: >-
      {{
        _override
        if (_override | length > 0
            and (_override.startswith(website_frontend_image + ':')
                 or _override.startswith(website_frontend_image + '@')))
        else website_frontend_image + ':' + website_prod_tag
      }}

- name: Afficher les images resolues
  ansible.builtin.debug:
    msg:
      - "Preprod backend:  {{ effective_preprod_backend_image }}"
      - "Preprod frontend: {{ effective_preprod_frontend_image }}"
      - "Prod backend:     {{ effective_prod_backend_image }}"
      - "Prod frontend:    {{ effective_prod_frontend_image }}"
      - "Rollback: {{ 'OUI (image_tag_override defini)' if (image_tag_override is defined and image_tag_override | length > 0) else 'NON (deploiement standard)' }}"

# -- Directories ---------------------------------------------------------------
- name: Create website directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "0750"
  loop:
    - "{{ apps_root }}/website-preprod"
    - "{{ apps_root }}/website-prod"

# -- Pull Docker images from GHCR ---------------------------------------------
- name: Pull backend image (preprod)
  community.docker.docker_image:
    name: "{{ effective_preprod_backend_image }}"
    source: pull
    force_source: true
  become: true
  become_user: "{{ deploy_user }}"

- name: Pull frontend image (preprod)
  community.docker.docker_image:
    name: "{{ effective_preprod_frontend_image }}"
    source: pull
    force_source: true
  become: true
  become_user: "{{ deploy_user }}"

- name: Pull backend image (prod)
  community.docker.docker_image:
    name: "{{ effective_prod_backend_image }}"
    source: pull
    force_source: true
  become: true
  become_user: "{{ deploy_user }}"

- name: Pull frontend image (prod)
  community.docker.docker_image:
    name: "{{ effective_prod_frontend_image }}"
    source: pull
    force_source: true
  become: true
  become_user: "{{ deploy_user }}"

# -- Preprod -------------------------------------------------------------------
- name: Deploy preprod docker-compose
  ansible.builtin.template:
    src: docker-compose-website.yml.j2
    dest: "{{ apps_root }}/website-preprod/docker-compose.yml"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "0640"
  vars:
    env: preprod
    site_domain: "{{ preprod_domain }}"
    backend_image: "{{ effective_preprod_backend_image }}"
    frontend_image: "{{ effective_preprod_frontend_image }}"
    db_name: "{{ preprod_db_name }}"
    db_user: "{{ preprod_db_user }}"
    db_password: "{{ preprod_db_password }}"
    jwt_secret: "{{ preprod_jwt_secret }}"
    google_analytics_id: "{{ preprod_google_analytics_id | default('') }}"
    robots_allow: "{{ preprod_robots_allow | default('false') }}"
  notify: Restart website-preprod

- name: Deploy preprod .env
  ansible.builtin.template:
    src: env.j2
    dest: "{{ apps_root }}/website-preprod/.env"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "0600"
  vars:
    env: preprod
    site_domain: "{{ preprod_domain }}"
    db_name: "{{ preprod_db_name }}"
    db_user: "{{ preprod_db_user }}"
    db_password: "{{ preprod_db_password }}"
    jwt_secret: "{{ preprod_jwt_secret }}"
    ga_stream_id: "{{ preprod_ga_stream_id }}"
  notify: Restart website-preprod

- name: Start preprod stack
  community.docker.docker_compose_v2:
    project_src: "{{ apps_root }}/website-preprod"
    state: present
  become: true
  become_user: "{{ deploy_user }}"

# -- Prod ----------------------------------------------------------------------
- name: Deploy prod docker-compose
  ansible.builtin.template:
    src: docker-compose-website.yml.j2
    dest: "{{ apps_root }}/website-prod/docker-compose.yml"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "0640"
  vars:
    env: prod
    site_domain: "{{ prod_domain }}"
    extra_domains: "{{ prod_www_domain }}"
    backend_image: "{{ effective_prod_backend_image }}"
    frontend_image: "{{ effective_prod_frontend_image }}"
    db_name: "{{ prod_db_name }}"
    db_user: "{{ prod_db_user }}"
    db_password: "{{ prod_db_password }}"
    jwt_secret: "{{ prod_jwt_secret }}"
    google_analytics_id: "{{ prod_google_analytics_id | default('') }}"
    robots_allow: "{{ prod_robots_allow | default('false') }}"
  notify: Restart website-prod

- name: Deploy prod .env
  ansible.builtin.template:
    src: env.j2
    dest: "{{ apps_root }}/website-prod/.env"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "0600"
  vars:
    env: prod
    site_domain: "{{ prod_domain }}"
    db_name: "{{ prod_db_name }}"
    db_user: "{{ prod_db_user }}"
    db_password: "{{ prod_db_password }}"
    jwt_secret: "{{ prod_jwt_secret }}"
    ga_stream_id: "{{ prod_ga_stream_id }}"
  notify: Restart website-prod

- name: Start prod stack
  community.docker.docker_compose_v2:
    project_src: "{{ apps_root }}/website-prod"
    state: present
  become: true
  become_user: "{{ deploy_user }}"

---
# =============================================================================
# Website role - Pull pre-built images from GHCR, deploy preprod + prod
# Both environments use the shared PostgreSQL instance
# Images are built by CI pipelines and pushed to GitHub Container Registry
#
# Variables optionnelles (rollback) :
#   image_tag_override : reference complete d'image (ghcr.io/org/repo/image:tag
#                        ou ghcr.io/org/repo/image@sha256:...) qui surcharge
#                        le backend OU le frontend selon le prefixe de l'image.
#   deploy_environment : "PREPROD" ou "PROD" pour scoper image_tag_override a
#                        un seul environnement. Si vide, l'override s'applique
#                        aux deux environnements (backward compat).
# =============================================================================

# -- Garde-fou sur le mode des cles Stripe -------------------------------------
# Une cle secrete Stripe porte son mode dans son prefixe : `sk_test_` ou
# `sk_live_`. Rien dans le backend ne distingue les deux, il encaisse avec ce
# qu'on lui donne. Une cle live posee en preprod facturerait donc de vrais
# clients au premier achat de recette ; une cle de test posee en prod
# accepterait les commandes sans jamais rien encaisser, et l'ecart ne se
# verrait qu'au rapprochement bancaire.
#
# La verification vit ici et non dans la CI GitHub : le vault est chiffre, la CI
# ne voit jamais la valeur en clair. Ansible est le premier maillon de la chaine
# a la connaitre, et il la connait avant d'ecrire le .env.
#
# On echoue plutot que d'avertir : rendre le .env puis redemarrer le conteneur
# suffit a mettre la mauvaise cle en service.

- name: Refuser une cle Stripe live en preprod
  ansible.builtin.assert:
    that:
      - not (preprod_stripe_secret_key | default('') is match('sk_live_'))
    fail_msg: >-
      preprod_stripe_secret_key est une cle live (prefixe `sk_live_`). La
      preprod encaisse en mode test : cette cle facturerait de vrais clients des
      le premier achat de recette. Corrige vault_preprod_stripe_secret_key dans
      le vault avec la cle `sk_test_` du dashboard Stripe (bascule « mode
      test »). Rendu du .env preprod refuse.
    quiet: true
  when: deploy_environment | default('') in ['', 'PREPROD']

- name: Refuser une cle Stripe de test en prod
  ansible.builtin.assert:
    that:
      - not (prod_stripe_secret_key | default('') is match('sk_test_'))
    fail_msg: >-
      prod_stripe_secret_key est une cle de test (prefixe `sk_test_`). La
      boutique accepterait les commandes sans jamais encaisser. Corrige
      vault_prod_stripe_secret_key dans le vault avec la cle live du dashboard
      Stripe. Rendu du .env prod refuse.
    quiet: true
  when: deploy_environment | default('') in ['', 'PROD']

# -- Calcul des references d'image pour preprod --------------------------------
# Si image_tag_override est fourni et correspond a l'image backend, l'utiliser ;
# sinon construire la reference standard.
# La correspondance se fait sur le prefixe de l'image.

- name: Resoudre les images preprod
  vars:
    _override: "{{ image_tag_override | default('') }}"
    _env: "{{ deploy_environment | default('') }}"
  ansible.builtin.set_fact:
    effective_preprod_backend_image: >-
      {{
        _override
        if (_override | length > 0
            and (_env == '' or _env == 'PREPROD')
            and (_override.startswith(website_backend_image + ':')
                 or _override.startswith(website_backend_image + '@')))
        else website_backend_image + ':' + website_preprod_tag
      }}
    effective_preprod_frontend_image: >-
      {{
        _override
        if (_override | length > 0
            and (_env == '' or _env == 'PREPROD')
            and (_override.startswith(website_frontend_image + ':')
                 or _override.startswith(website_frontend_image + '@')))
        else website_frontend_image + ':' + website_preprod_tag
      }}

- name: Resoudre les images prod
  vars:
    _override: "{{ image_tag_override | default('') }}"
    _env: "{{ deploy_environment | default('') }}"
  ansible.builtin.set_fact:
    effective_prod_backend_image: >-
      {{
        _override
        if (_override | length > 0
            and (_env == '' or _env == 'PROD')
            and (_override.startswith(website_backend_image + ':')
                 or _override.startswith(website_backend_image + '@')))
        else website_backend_image + ':' + website_prod_tag
      }}
    effective_prod_frontend_image: >-
      {{
        _override
        if (_override | length > 0
            and (_env == '' or _env == 'PROD')
            and (_override.startswith(website_frontend_image + ':')
                 or _override.startswith(website_frontend_image + '@')))
        else website_frontend_image + ':' + website_prod_tag
      }}

- name: Afficher les images resolues
  ansible.builtin.debug:
    msg:
      - "Preprod backend:  {{ effective_preprod_backend_image }}"
      - "Preprod frontend: {{ effective_preprod_frontend_image }}"
      - "Prod backend:     {{ effective_prod_backend_image }}"
      - "Prod frontend:    {{ effective_prod_frontend_image }}"
      - >-
        Rollback: {{ 'OUI (image_tag_override defini)'
        if (image_tag_override is defined and image_tag_override | length > 0)
        else 'NON (deploiement standard)' }}
      - "Env cible: {{ deploy_environment | default('TOUS') }}"

# -- Directories ---------------------------------------------------------------
- name: Create website directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "0750"
  loop:
    - "{{ apps_root }}/website-preprod"
    - "{{ apps_root }}/website-prod"

# -- Pull Docker images from GHCR ---------------------------------------------
# Les pulls sont scope sur deploy_environment pour eviter les 404 sur des
# tags d'un environnement non deploye (ex: :RELEASE inexistant tant qu'aucun
# tag git vX.Y.Z n'a declenche le workflow CI).
# - deploy_environment vide  : pull les 4 images (compat backward)
# - deploy_environment=PREPROD : pull uniquement preprod
# - deploy_environment=PROD    : pull uniquement prod

- name: Pull backend image (preprod)
  community.docker.docker_image:
    name: "{{ effective_preprod_backend_image }}"
    source: pull
    force_source: true
  become: true
  become_user: "{{ deploy_user }}"
  when: deploy_environment | default('') in ['', 'PREPROD']

- name: Pull frontend image (preprod)
  community.docker.docker_image:
    name: "{{ effective_preprod_frontend_image }}"
    source: pull
    force_source: true
  become: true
  become_user: "{{ deploy_user }}"
  when: deploy_environment | default('') in ['', 'PREPROD']

- name: Pull backend image (prod)
  community.docker.docker_image:
    name: "{{ effective_prod_backend_image }}"
    source: pull
    force_source: true
  become: true
  become_user: "{{ deploy_user }}"
  when: deploy_environment | default('') in ['', 'PROD']

- name: Pull frontend image (prod)
  community.docker.docker_image:
    name: "{{ effective_prod_frontend_image }}"
    source: pull
    force_source: true
  become: true
  become_user: "{{ deploy_user }}"
  when: deploy_environment | default('') in ['', 'PROD']

# -- Preprod -------------------------------------------------------------------
# Bloc preprod : skip entierement si deploy_environment == 'PROD' pour ne pas
# toucher au stack preprod lors d'un deploiement PROD cible.
- name: Deploy preprod docker-compose
  ansible.builtin.template:
    src: docker-compose-website.yml.j2
    dest: "{{ apps_root }}/website-preprod/docker-compose.yml"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "0640"
  vars:
    env: preprod
    site_domain: "{{ preprod_domain }}"
    backend_image: "{{ effective_preprod_backend_image }}"
    frontend_image: "{{ effective_preprod_frontend_image }}"
    db_name: "{{ preprod_db_name }}"
    db_user: "{{ preprod_db_user }}"
    db_password: "{{ preprod_db_password }}"
    jwt_secret: "{{ preprod_jwt_secret }}"
    google_analytics_id: "{{ preprod_google_analytics_id | default('') }}"
    matomo_site_id: "{{ preprod_matomo_site_id | default('') }}"
    robots_allow: "{{ preprod_robots_allow | default('false') }}"
  notify: Restart website-preprod
  when: deploy_environment | default('') in ['', 'PREPROD']

- name: Deploy preprod .env
  ansible.builtin.template:
    src: env.j2
    dest: "{{ apps_root }}/website-preprod/.env"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "0600"
  vars:
    env: preprod
    site_domain: "{{ preprod_domain }}"
    db_name: "{{ preprod_db_name }}"
    db_user: "{{ preprod_db_user }}"
    db_password: "{{ preprod_db_password }}"
    jwt_secret: "{{ preprod_jwt_secret }}"
    ga_stream_id: "{{ preprod_ga_stream_id }}"
    stripe_secret_key: "{{ preprod_stripe_secret_key }}"
    stripe_webhook_secret: "{{ preprod_stripe_webhook_secret }}"
  notify: Restart website-preprod
  when: deploy_environment | default('') in ['', 'PREPROD']

- name: Start preprod stack
  community.docker.docker_compose_v2:
    project_src: "{{ apps_root }}/website-preprod"
    state: present
    # Les tags :PREPROD et :RELEASE sont flottants : leur digest change sans que
    # le docker-compose.yml bouge. Sans `pull: always`, Compose se contente de
    # l'image deja presente sur l'hote et le deploiement devient un no-op
    # silencieux. Compose ne recree ensuite que les conteneurs dont l'image a
    # reellement change.
    pull: always
    # Filet de securite : permet de forcer la recreation d'un conteneur reste
    # dans un etat degrade alors que son image est a jour, sans avoir a agir a
    # la main sur le VPS.
    recreate: "{{ 'always' if (force_recreate | default(false) | bool) else 'auto' }}"
  become: true
  become_user: "{{ deploy_user }}"
  when: deploy_environment | default('') in ['', 'PREPROD']

- name: Verify preprod server-side rendering
  ansible.builtin.include_tasks: verify-ssr.yml
  vars:
    website_env: preprod
    website_domain: "{{ preprod_domain }}"
  when: deploy_environment | default('') in ['', 'PREPROD']

# -- Prod ----------------------------------------------------------------------
# Bloc prod : skip entierement si deploy_environment == 'PREPROD' pour eviter
# de re-templater/redemarrer le stack prod inutilement (et de hit un 404 sur
# :RELEASE tant qu'aucun tag git vX.Y.Z n'a ete pousse).
- name: Deploy prod docker-compose
  ansible.builtin.template:
    src: docker-compose-website.yml.j2
    dest: "{{ apps_root }}/website-prod/docker-compose.yml"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "0640"
  vars:
    env: prod
    site_domain: "{{ prod_domain }}"
    extra_domains: "{{ prod_www_domain }}"
    backend_image: "{{ effective_prod_backend_image }}"
    frontend_image: "{{ effective_prod_frontend_image }}"
    db_name: "{{ prod_db_name }}"
    db_user: "{{ prod_db_user }}"
    db_password: "{{ prod_db_password }}"
    jwt_secret: "{{ prod_jwt_secret }}"
    google_analytics_id: "{{ prod_google_analytics_id | default('') }}"
    matomo_site_id: "{{ prod_matomo_site_id | default('') }}"
    robots_allow: "{{ prod_robots_allow | default('false') }}"
  notify: Restart website-prod
  when: deploy_environment | default('') in ['', 'PROD']

- name: Deploy prod .env
  ansible.builtin.template:
    src: env.j2
    dest: "{{ apps_root }}/website-prod/.env"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "0600"
  vars:
    env: prod
    site_domain: "{{ prod_domain }}"
    db_name: "{{ prod_db_name }}"
    db_user: "{{ prod_db_user }}"
    db_password: "{{ prod_db_password }}"
    jwt_secret: "{{ prod_jwt_secret }}"
    ga_stream_id: "{{ prod_ga_stream_id }}"
    stripe_secret_key: "{{ prod_stripe_secret_key }}"
    stripe_webhook_secret: "{{ prod_stripe_webhook_secret }}"
  notify: Restart website-prod
  when: deploy_environment | default('') in ['', 'PROD']

- name: Start prod stack
  community.docker.docker_compose_v2:
    project_src: "{{ apps_root }}/website-prod"
    state: present
    # Voir le commentaire du stack preprod : un tag flottant impose un pull a
    # chaque deploiement, sinon l'image locale fige la version servie.
    pull: always
    recreate: "{{ 'always' if (force_recreate | default(false) | bool) else 'auto' }}"
  become: true
  become_user: "{{ deploy_user }}"
  when: deploy_environment | default('') in ['', 'PROD']

- name: Verify prod server-side rendering
  ansible.builtin.include_tasks: verify-ssr.yml
  vars:
    website_env: prod
    website_domain: "{{ prod_domain }}"
  when: deploy_environment | default('') in ['', 'PROD']

# -- Diagnostic a la demande ---------------------------------------------------
# Ne s'execute que sur demande explicite (`--tags website-diag`) : le tag
# `never` garantit qu'un deploiement normal ne le declenche jamais. Ces taches
# ne modifient rien, elles lisent l'etat du conteneur et ses logs.
- name: Collect preprod frontend diagnostics
  # `apply` est indispensable : un `include_tasks` ne transmet pas ses tags a
  # ses taches filles. Sans lui, `--tags website-diag` execute l'include et
  # filtre tout son contenu — l'inclusion apparait dans la sortie, mais rien
  # ne s'execute.
  ansible.builtin.include_tasks:
    file: diagnostics.yml
    apply:
      tags:
        - website-diag
  vars:
    website_env: preprod
    website_domain: "{{ preprod_domain }}"
  tags:
    - website-diag
    - never
  when: deploy_environment | default('') in ['', 'PREPROD']

- name: Collect prod frontend diagnostics
  # `apply` est indispensable : un `include_tasks` ne transmet pas ses tags a
  # ses taches filles. Sans lui, `--tags website-diag` execute l'include et
  # filtre tout son contenu — l'inclusion apparait dans la sortie, mais rien
  # ne s'execute.
  ansible.builtin.include_tasks:
    file: diagnostics.yml
    apply:
      tags:
        - website-diag
  vars:
    website_env: prod
    website_domain: "{{ prod_domain }}"
  tags:
    - website-diag
    - never
  when: deploy_environment | default('') in ['', 'PROD']

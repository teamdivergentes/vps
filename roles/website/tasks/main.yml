---
# =============================================================================
# Website role - Clone repos, build images, deploy preprod + prod
# Both environments use the shared PostgreSQL instance
# =============================================================================

# -- Source code ---------------------------------------------------------------
- name: Create source directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "0750"
  loop:
    - "{{ apps_root }}/src"
    - "{{ apps_root }}/website-preprod"
    - "{{ apps_root }}/website-prod"

- name: Clone backend repo
  ansible.builtin.git:
    repo: "{{ website_backend_repo }}"
    dest: "{{ apps_root }}/src/website_backend"
    version: "{{ website_branch_preprod }}"
    force: true
  become: true
  become_user: "{{ deploy_user }}"
  register: backend_repo

- name: Clone frontend repo
  ansible.builtin.git:
    repo: "{{ website_frontend_repo }}"
    dest: "{{ apps_root }}/src/website_frontend"
    version: "{{ website_branch_preprod }}"
    force: true
  become: true
  become_user: "{{ deploy_user }}"
  register: frontend_repo

# -- Build Docker images -------------------------------------------------------
- name: Build backend image
  community.docker.docker_image:
    name: dvg/website-backend
    tag: latest
    source: build
    build:
      path: "{{ apps_root }}/src/website_backend"
      dockerfile: Dockerfile
      target: production
    force_source: "{{ backend_repo.changed }}"

- name: Build frontend image
  community.docker.docker_image:
    name: dvg/website-frontend
    tag: latest
    source: build
    build:
      path: "{{ apps_root }}/src/website_frontend"
      dockerfile: Dockerfile
      target: production
    force_source: "{{ frontend_repo.changed }}"

# -- Preprod -------------------------------------------------------------------
- name: Deploy preprod docker-compose
  ansible.builtin.template:
    src: docker-compose-website.yml.j2
    dest: "{{ apps_root }}/website-preprod/docker-compose.yml"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "0640"
  vars:
    env: preprod
    site_domain: "{{ preprod_domain }}"
    db_name: "{{ preprod_db_name }}"
    db_user: "{{ preprod_db_user }}"
    db_password: "{{ preprod_db_password }}"
    jwt_secret: "{{ preprod_jwt_secret }}"
  notify: restart website-preprod

- name: Deploy preprod .env
  ansible.builtin.template:
    src: env.j2
    dest: "{{ apps_root }}/website-preprod/.env"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "0600"
  vars:
    env: preprod
    site_domain: "{{ preprod_domain }}"
    db_name: "{{ preprod_db_name }}"
    db_user: "{{ preprod_db_user }}"
    db_password: "{{ preprod_db_password }}"
    jwt_secret: "{{ preprod_jwt_secret }}"
  notify: restart website-preprod

- name: Start preprod stack
  community.docker.docker_compose_v2:
    project_src: "{{ apps_root }}/website-preprod"
    state: present
  become: true
  become_user: "{{ deploy_user }}"

# -- Prod ----------------------------------------------------------------------
- name: Deploy prod docker-compose
  ansible.builtin.template:
    src: docker-compose-website.yml.j2
    dest: "{{ apps_root }}/website-prod/docker-compose.yml"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "0640"
  vars:
    env: prod
    site_domain: "{{ prod_domain }}"
    extra_domains: "{{ prod_www_domain }}"
    db_name: "{{ prod_db_name }}"
    db_user: "{{ prod_db_user }}"
    db_password: "{{ prod_db_password }}"
    jwt_secret: "{{ prod_jwt_secret }}"
  notify: restart website-prod

- name: Deploy prod .env
  ansible.builtin.template:
    src: env.j2
    dest: "{{ apps_root }}/website-prod/.env"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "0600"
  vars:
    env: prod
    site_domain: "{{ prod_domain }}"
    db_name: "{{ prod_db_name }}"
    db_user: "{{ prod_db_user }}"
    db_password: "{{ prod_db_password }}"
    jwt_secret: "{{ prod_jwt_secret }}"
  notify: restart website-prod

- name: Start prod stack
  community.docker.docker_compose_v2:
    project_src: "{{ apps_root }}/website-prod"
    state: present
  become: true
  become_user: "{{ deploy_user }}"

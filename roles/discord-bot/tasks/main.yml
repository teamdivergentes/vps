---
# =============================================================================
# Discord Bot role - Pull pre-built image from GHCR and deploy
# Uses the shared PostgreSQL instance
# Image is built by CI pipeline and pushed to GitHub Container Registry
# =============================================================================

# -- Résolution de l'image effective (rollback ou déploiement standard) --------
# image_tag_override : référence complète (ghcr.io/org/image:tag ou @sha256:...)
#   Surcharge discord_bot_tag si elle correspond à l'image du bot.
- name: Résoudre l'image Discord bot effective
  vars:
    _override: "{{ image_tag_override | default('') }}"
  ansible.builtin.set_fact:
    effective_discord_bot_image: >-
      {{
        _override
        if (_override | length > 0
            and (_override.startswith(discord_bot_image + ':')
                 or _override.startswith(discord_bot_image + '@')))
        else discord_bot_image + ':' + discord_bot_tag
      }}

- name: Afficher l'image Discord bot résolue
  ansible.builtin.debug:
    msg:
      - "Image effective: {{ effective_discord_bot_image }}"
      - >-
        Rollback: {{ 'OUI (image_tag_override défini)'
        if (image_tag_override is defined and image_tag_override | length > 0)
        else 'NON (déploiement standard)' }}

- name: Create Discord bot directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "0750"
  loop:
    - "{{ apps_root }}/discord-bot"
    - "{{ apps_root }}/discord-bot/logs"
    - "{{ apps_root }}/discord-bot/sql"

- name: Create Discord bot secrets directory (UID 1001 matches botuser in container)
  ansible.builtin.file:
    path: "{{ apps_root }}/discord-bot/secrets"
    state: directory
    owner: "1001"
    group: "{{ deploy_group }}"
    mode: "0750"

- name: Create Discord bot data directory (UID 1001 matches botuser in container)
  ansible.builtin.file:
    path: "{{ apps_root }}/discord-bot/data"
    state: directory
    owner: "1001"
    group: "{{ deploy_group }}"
    mode: "0750"

# ── Database initialization (idempotent) ─────────────────────────────────────

- name: Copy Discord bot SQL schema
  ansible.builtin.copy:
    src: init.sql
    dest: "{{ apps_root }}/discord-bot/sql/init.sql"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "0644"
  register: discord_init_sql

- name: Copy Discord bot SQL seed data
  ansible.builtin.copy:
    src: data.sql
    dest: "{{ apps_root }}/discord-bot/sql/data.sql"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "0644"
  register: discord_data_sql

- name: Initialize Discord bot database schema
  ansible.builtin.shell: >
    docker exec -i dvg-shared-postgres
    psql -U {{ discord_db_user }} -d {{ discord_db_name }}
    < {{ apps_root }}/discord-bot/sql/init.sql
  register: discord_init_result
  changed_when: discord_init_sql.changed

- name: Seed Discord bot database data
  ansible.builtin.shell: >
    docker exec -i dvg-shared-postgres
    psql -U {{ discord_db_user }} -d {{ discord_db_name }}
    < {{ apps_root }}/discord-bot/sql/data.sql
  register: discord_data_result
  changed_when: discord_data_sql.changed

# ── Deploy & start ───────────────────────────────────────────────────────────

- name: Deploy Google credentials for Discord bot
  ansible.builtin.copy:
    content: "{{ discord_google_credentials }}"
    dest: "{{ apps_root }}/discord-bot/secrets/google-credentials.json"
    owner: "1001"
    group: "{{ deploy_group }}"
    mode: "0600"
  notify: Restart discord-bot

- name: Pull Discord bot image from GHCR
  community.docker.docker_image:
    name: "{{ effective_discord_bot_image }}"
    source: pull
    force_source: true
  become: true
  become_user: "{{ deploy_user }}"

- name: Deploy Discord bot docker-compose
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ apps_root }}/discord-bot/docker-compose.yml"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "0640"
  notify: Restart discord-bot

- name: Deploy Discord bot .env
  ansible.builtin.template:
    src: env.j2
    dest: "{{ apps_root }}/discord-bot/.env"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "0600"
  notify: Restart discord-bot

- name: Start Discord bot
  community.docker.docker_compose_v2:
    project_src: "{{ apps_root }}/discord-bot"
    state: present
  become: true
  become_user: "{{ deploy_user }}"

---
# =============================================================================
# Odoo role - Deploy Odoo 19 with dedicated PostgreSQL 16 and Nginx proxy
# Uses custom image tellebma/isii_app
# =============================================================================

- name: Create Odoo directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "0755"
  loop:
    - "{{ apps_root }}/odoo"
    - "{{ apps_root }}/odoo/config"
    - "{{ apps_root }}/odoo/nginx"
    - "{{ apps_root }}/odoo/nginx/conf.d"

- name: Deploy Odoo docker-compose
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ apps_root }}/odoo/docker-compose.yml"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "0640"
  notify: Restart odoo

- name: Deploy Odoo configuration
  ansible.builtin.template:
    src: odoo.conf.j2
    dest: "{{ apps_root }}/odoo/config/odoo.conf"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "0644"
  notify: Restart odoo

- name: Deploy Nginx main configuration
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: "{{ apps_root }}/odoo/nginx/nginx.conf"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "0644"
  notify: Restart odoo

- name: Deploy Nginx Odoo vhost configuration
  ansible.builtin.template:
    src: nginx-odoo.conf.j2
    dest: "{{ apps_root }}/odoo/nginx/conf.d/odoo.conf"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "0644"
  notify: Restart odoo

- name: Start Odoo stack
  community.docker.docker_compose_v2:
    project_src: "{{ apps_root }}/odoo"
    state: present
    pull: always
  become: true
  become_user: "{{ deploy_user }}"

# =============================================================================
# Renouvellement mensuel de la licence Odoo Enterprise
# Met a jour les cles ir_config_parameter (database.expiration_date,
# database.expiration_reason, database.enterprise_code) avec une date
# d'expiration fixee a aujourd'hui + 3 ans, puis redemarre odoo-web et
# odoo-nginx.
# =============================================================================
- name: Deploy Odoo license renewal script
  ansible.builtin.template:
    src: odoo-license-renew.sh.j2
    dest: /usr/local/sbin/odoo-license-renew.sh
    owner: root
    group: root
    mode: "0750"

- name: Ensure Odoo license renewal log file exists
  ansible.builtin.file:
    path: /var/log/odoo-license-renew.log
    state: touch
    owner: root
    group: root
    mode: "0640"
    modification_time: preserve
    access_time: preserve

- name: Schedule monthly Odoo license renewal
  ansible.builtin.cron:
    name: "odoo license renewal"
    user: root
    minute: "{{ odoo_license_renew_minute }}"
    hour: "{{ odoo_license_renew_hour }}"
    day: "{{ odoo_license_renew_day }}"
    month: "*"
    weekday: "*"
    job: "/usr/local/sbin/odoo-license-renew.sh"
    cron_file: odoo-license-renew

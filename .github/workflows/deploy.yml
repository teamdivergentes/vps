---
# =============================================================================
# CI/CD - Deploy VPS infrastructure via Ansible
# =============================================================================
name: Deploy Infrastructure

on:
  push:
    branches: [main]
    paths:
      - 'roles/**'
      - 'inventory/**'
      - 'site.yml'
      - 'requirements.yml'
      - 'bootstrap.yml'
  workflow_dispatch:
    inputs:
      tags:
        description: "Ansible tags to run (comma-separated, e.g. website,odoo)"
        required: false
        default: ""
      environment:
        description: "Target environment"
        required: false
        default: "production"
        type: choice
        options:
          - production
          - all
      correlation_id:
        description: "Correlation ID for tracking (set by caller CI)"
        required: false
        default: ""
      image_tag:
        description: "Docker image tag/digest to deploy (rollback: ghcr.io/org/repo/image@sha256:... or :tag)"
        required: false
        default: ""
      rollback_mode:
        description: "Set to 'true' when this dispatch is a rollback (disables smoke test loop)"
        required: false
        default: "false"
      deploy_environment:
        description: "Target environment for image_tag_override scoping (PREPROD or PROD, empty = both)"
        required: false
        default: ""

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  lint:
    name: "Lint Ansible"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.12'

      - name: Install ansible-lint
        run: pip install "ansible-lint>=24.0,<25.0" "ansible-core>=2.16,<2.18"

      - name: Run ansible-lint
        run: |
          ansible-lint site.yml -f pep8 2>&1 | tee lint-output.txt || true
          while IFS=: read -r file lineno col rest; do
            if [ -n "$lineno" ] && echo "$lineno" | grep -qE '^[0-9]+$'; then
              echo "::warning file=${file},line=${lineno}::${rest}"
            fi
          done < lint-output.txt
          ansible-lint site.yml

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    environment: production
    needs: [lint]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.12'

      - name: Install Ansible and dependencies
        run: |
          pip install "ansible>=9.0,<10.0" "docker>=7.0,<8.0"
          ansible-galaxy install -r requirements.yml

      - name: Setup SSH key
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.VPS_SSH_FINGERPRINT }}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Create vault password file
        run: echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > .vault_pass
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}

      - name: Validate and run Ansible playbook
        env:
          INPUT_TAGS: ${{ github.event.inputs.tags }}
          INPUT_IMAGE_TAG: ${{ github.event.inputs.image_tag }}
          INPUT_ROLLBACK_MODE: ${{ github.event.inputs.rollback_mode }}
          INPUT_DEPLOY_ENV: ${{ github.event.inputs.deploy_environment }}
        run: |
          set -euo pipefail

          # Journalisation du contexte de deploiement
          if [[ "$INPUT_ROLLBACK_MODE" == "true" ]]; then
            echo "Mode ROLLBACK - deploiement avec image specifique"
          fi
          if [[ -n "$INPUT_IMAGE_TAG" ]]; then
            echo "Image cible: $INPUT_IMAGE_TAG"
          fi

          # Validation et traitement des tags Ansible
          if [ -n "$INPUT_TAGS" ]; then
            # Validation stricte : caractères autorisés uniquement
            if ! echo "$INPUT_TAGS" | grep -qE '^[a-zA-Z0-9,_-]+$'; then
              echo "Tags invalides: caracteres non autorises"
              exit 1
            fi
            # Whitelist des tags Ansible autorises
            ALLOWED_TAGS="common docker traefik postgresql website odoo teamspeak discord portainer pgadmin monitoring"
            IFS=',' read -ra TAGS_ARRAY <<< "$INPUT_TAGS"
            for tag in "${TAGS_ARRAY[@]}"; do
              tag=$(echo "$tag" | tr -d ' ')
              if ! echo "$ALLOWED_TAGS" | grep -qw "$tag"; then
                echo "Tag non autorise: $tag"
                exit 1
              fi
            done
            EXTRA_ARGS=("--tags" "$INPUT_TAGS")
          else
            EXTRA_ARGS=()
          fi

          # Injection du tag d'image specifique pour le rollback
          # INPUT_IMAGE_TAG peut etre:
          #   - ghcr.io/org/repo/image@sha256:abc123...  (digest)
          #   - ghcr.io/org/repo/image:PREPROD           (tag flottant)
          # Ansible recevra la variable image_tag_override qui surcharge
          # website_preprod_tag ou website_prod_tag selon le contexte.
          if [[ -n "$INPUT_IMAGE_TAG" ]]; then
            # Validation : seuls les caracteres autorises dans une reference d'image
            if ! echo "$INPUT_IMAGE_TAG" | grep -qE '^[a-zA-Z0-9/:._@-]+$'; then
              echo "image_tag invalide: caracteres non autorises"
              exit 1
            fi
            EXTRA_ARGS+=("--extra-vars" "image_tag_override=${INPUT_IMAGE_TAG}")
          fi

          # Scoper le rollback a un seul environnement
          if [[ -n "$INPUT_DEPLOY_ENV" ]]; then
            if [[ "$INPUT_DEPLOY_ENV" != "PREPROD" && "$INPUT_DEPLOY_ENV" != "PROD" ]]; then
              echo "deploy_environment invalide: $INPUT_DEPLOY_ENV (attendu: PREPROD ou PROD)"
              exit 1
            fi
            EXTRA_ARGS+=("--extra-vars" "deploy_environment=${INPUT_DEPLOY_ENV}")
          fi

          ansible-playbook site.yml \
            --vault-password-file .vault_pass \
            "${EXTRA_ARGS[@]}"

      - name: Smoke tests post-deploy
        if: success() && github.event.inputs.rollback_mode != 'true'
        env:
          DEPLOY_ENV: ${{ github.event.inputs.deploy_environment }}
        run: |
          set -euo pipefail

          TESTS_PASSED=0
          TESTS_TOTAL=0

          check_url() {
            local url="$1"
            local description="$2"
            TESTS_TOTAL=$((TESTS_TOTAL + 1))

            for attempt in $(seq 1 12); do
              HTTP_STATUS=$(curl -sf -o /dev/null -w "%{http_code}" --max-time 10 "$url" 2>/dev/null || echo "0")
              if [[ "$HTTP_STATUS" == "200" ]]; then
                echo "[OK] [$description] HTTP 200 OK"
                TESTS_PASSED=$((TESTS_PASSED + 1))
                return 0
              fi
              echo "  [$attempt/12] $description -> HTTP $HTTP_STATUS"
              sleep 10
            done
            echo "[FAIL] [$description] FAILED after 12 attempts"
            return 1
          }

          FAILED=0

          # Prod health checks (skip si deploy cible uniquement PREPROD)
          if [[ "$DEPLOY_ENV" != "PREPROD" ]]; then
            check_url "https://www.teamdivergentes.fr/health" "Frontend health" || FAILED=1
            check_url "https://www.teamdivergentes.fr/" "Homepage" || FAILED=1
            check_url "https://www.teamdivergentes.fr/api/teams" "Backend API (teams)" || FAILED=1
          fi

          # Preprod health checks (skip si deploy cible uniquement PROD)
          if [[ "$DEPLOY_ENV" != "PROD" ]]; then
            check_url "https://preprod.teamdivergentes.fr/health" "Preprod frontend" || FAILED=1
            check_url "https://preprod.teamdivergentes.fr/api/teams" "Preprod API (teams)" || FAILED=1
          fi

          echo ""
          echo "Smoke tests: $TESTS_PASSED/$TESTS_TOTAL passed"

          if [[ "$FAILED" -ne 0 ]]; then
            echo "WARNING: Some smoke tests failed!"
            exit 1
          fi

          echo "All smoke tests passed!"

      - name: Cleanup secrets
        if: always()
        run: |
          rm -f .vault_pass
          rm -f ~/.ssh/id_ed25519

---
# =============================================================================
# CI/CD - Deploy VPS infrastructure via Ansible
# =============================================================================
name: Deploy Infrastructure

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tags:
        description: "Ansible tags to run (comma-separated, e.g. website,odoo)"
        required: false
        default: ""
      environment:
        description: "Target environment"
        required: false
        default: "production"
        type: choice
        options:
          - production
          - all
      correlation_id:
        description: "Correlation ID for tracking (set by caller CI)"
        required: false
        default: ""

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  lint:
    name: "Bonus — Lint Ansible"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install ansible-lint
        run: pip install "ansible-lint>=24.0,<25.0"

      - name: Run ansible-lint
        run: |
          ansible-lint site.yml -f pep8 2>&1 | tee lint-output.txt || true
          while IFS=: read -r file lineno col rest; do
            if [ -n "$lineno" ] && echo "$lineno" | grep -qE '^[0-9]+$'; then
              echo "::warning file=${file},line=${lineno}::${rest}"
            fi
          done < lint-output.txt
          ansible-lint site.yml

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    environment: production
    needs: [lint]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Ansible and dependencies
        run: |
          pip install "ansible>=9.0,<10.0" "docker>=7.0,<8.0"
          ansible-galaxy install -r requirements.yml

      - name: Setup SSH key
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.VPS_SSH_FINGERPRINT }}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Create vault password file
        run: echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > .vault_pass
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}

      - name: Validate and run Ansible playbook
        env:
          INPUT_TAGS: ${{ github.event.inputs.tags }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_TAGS" ]; then
            # Validation stricte : caractères autorisés uniquement
            if ! echo "$INPUT_TAGS" | grep -qE '^[a-zA-Z0-9,_-]+$'; then
              echo "Tags invalides: caracteres non autorises"
              exit 1
            fi
            # Whitelist des tags Ansible autorises
            ALLOWED_TAGS="common docker traefik postgresql website odoo teamspeak discord portainer pgadmin"
            IFS=',' read -ra TAGS_ARRAY <<< "$INPUT_TAGS"
            for tag in "${TAGS_ARRAY[@]}"; do
              tag=$(echo "$tag" | tr -d ' ')
              if ! echo "$ALLOWED_TAGS" | grep -qw "$tag"; then
                echo "Tag non autorise: $tag"
                exit 1
              fi
            done
            EXTRA_ARGS=("--tags" "$INPUT_TAGS")
          else
            EXTRA_ARGS=()
          fi
          ansible-playbook site.yml \
            --vault-password-file .vault_pass \
            "${EXTRA_ARGS[@]}"

      - name: Cleanup secrets
        if: always()
        run: |
          rm -f .vault_pass
          rm -f ~/.ssh/id_ed25519

---
# =============================================================================
# CI/CD - Deploy VPS infrastructure via Ansible
# =============================================================================
name: Deploy Infrastructure

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tags:
        description: "Ansible tags to run (comma-separated, e.g. website,odoo)"
        required: false
        default: ""
      environment:
        description: "Target environment"
        required: false
        default: "production"
        type: choice
        options:
          - production
          - all

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    name: "Bonus — Lint Ansible"
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install ansible-lint
        run: pip install ansible-lint

      - name: Run ansible-lint
        run: |
          ansible-lint site.yml -f pep8 2>&1 | tee lint-output.txt || true
          while IFS=: read -r file lineno col rest; do
            if [ -n "$lineno" ] && echo "$lineno" | grep -qE '^[0-9]+$'; then
              echo "::warning file=${file},line=${lineno}::${rest}"
            fi
          done < lint-output.txt
          ansible-lint site.yml

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Install Ansible and dependencies
        run: |
          pip install ansible docker
          ansible-galaxy install -r requirements.yml

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.VPS_IP }} >> ~/.ssh/known_hosts

      - name: Create vault password file
        run: echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > .vault_pass
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}

      - name: Run Ansible playbook
        run: |
          EXTRA_ARGS=""
          if [ -n "${{ github.event.inputs.tags }}" ]; then
            EXTRA_ARGS="--tags ${{ github.event.inputs.tags }}"
          fi
          ansible-playbook site.yml \
            --vault-password-file .vault_pass \
            $EXTRA_ARGS
        env:
          ANSIBLE_HOST_KEY_CHECKING: "false"

      - name: Cleanup secrets
        if: always()
        run: |
          rm -f .vault_pass
          rm -f ~/.ssh/id_ed25519
